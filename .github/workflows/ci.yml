name: CI / Sonar

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  detect-modules:
    name: Detect Testable Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set-modules.outputs.modules }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to diff against the base commit

      - name: Find Affected Modules with Tests
        id: set-modules
        run: |
          # Pushes to main test everything (keeps the Sonar baseline complete);
          # PRs test only changed modules plus their dependents.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE=""
            HEAD="${{ github.sha }}"
          fi
          JSON=$(scripts/changed-modules.sh "$BASE" "$HEAD")
          echo "Affected modules: $JSON"
          echo "modules=$JSON" >> $GITHUB_OUTPUT

  build-and-test:
    name: Test ${{ matrix.module }}
    needs: detect-modules
    if: needs.detect-modules.outputs.modules != '[]'
    runs-on: macos-15 # Uses Apple Silicon M1/M2 runners with latest Xcode pre-installed
    strategy:
          fail-fast: false # Prevents one module's failure from cancelling the others
          matrix:
            module: ${{ fromJson(needs.detect-modules.outputs.modules) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones must be disabled for a meaningful SonarCloud analysis

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Run Tests and Generate Coverage for All Modules
        env:
          SKIP_ACTION: none
        run: |
          # Force CoreSimulator to initialize and cache available devices to prevent random missing simulator errors
          xcrun simctl list devices available > /dev/null

          # Download official SonarSource conversion script
          curl --proto '=https' --tlsv1.2 -LO https://raw.githubusercontent.com/SonarSource/sonar-scanning-examples/master/swift-coverage/swift-coverage-example/xccov-to-sonarqube-generic.sh
          chmod +x xccov-to-sonarqube-generic.sh
          
          # Create a directory to hold all individual coverage XMLs
          mkdir -p coverage-reports

          echo "Running tests for ${{ matrix.module }}..."
          
          # Run xcodebuild for the specific module[cite: 33]
                    (
                      cd libraries/${{ matrix.module }}
                      xcodebuild test \
                        -scheme "${{ matrix.module }}" \
                        -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
                        -skipPackagePluginValidation \
                        -skipMacroValidation \
                        -enableCodeCoverage YES \
                        -resultBundlePath "TestResults.xcresult"
                    )
              
              # Convert the xcodebuild .xcresult bundle to generic XML
            ./xccov-to-sonarqube-generic.sh libraries/${{ matrix.module }}/TestResults.xcresult > "coverage-reports/${{ matrix.module }}-coverage.xml"

            # Strip absolute macOS paths so Ubuntu SonarScanner can read them
          sed -i '' "s|$(pwd)/||g" "coverage-reports/${{ matrix.module }}-coverage.xml"

      - name: Extract Module Coverage Summary
        run: |
          mkdir -p coverage-summary
          # Sum line coverage over the module's own targets (skip test bundles)
          xcrun xccov view --report --json "libraries/${{ matrix.module }}/TestResults.xcresult" \
            | jq --arg m "${{ matrix.module }}" '
                [.targets[] | select((.name | startswith($m)) and (.name | test("Tests") | not))] as $t
                | {module: $m,
                   covered: ([$t[].coveredLines] | add // 0),
                   executable: ([$t[].executableLines] | add // 0)}' \
            > "coverage-summary/${{ matrix.module }}.json"

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.module }}
          path: coverage-reports/*.xml

      - name: Upload Coverage Summary
        uses: actions/upload-artifact@v4
        with:
          name: summary-${{ matrix.module }}
          path: coverage-summary/*.json

  coverage-report:
    name: Post Coverage Summary
    needs: build-and-test
    if: needs.build-and-test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Comment on the PR
      contents: write      # Comment on a commit (pushes to main)
      actions: read        # Download the baseline artifact from the last main run
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download This Run's Summaries
        uses: actions/download-artifact@v4
        with:
          path: current-coverage
          pattern: summary-*
          merge-multiple: true

      - name: Download Baseline From Last Main Run
        if: github.event_name == 'pull_request'
        continue-on-error: true # No baseline yet is fine; the table just lists tested modules
        run: |
          RUN_ID=$(gh run list --repo "${{ github.repository }}" --workflow ci.yml --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          [ -n "$RUN_ID" ] && gh run download "$RUN_ID" --repo "${{ github.repository }}" \
            --name coverage-baseline --dir baseline-coverage

      - name: Build Coverage Table
        run: |
          scripts/coverage-summary.sh current-coverage baseline-coverage > coverage-comment.md
          cat coverage-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save Baseline (main only)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-baseline
          path: merged-coverage/*.json

      - name: Post Pull Request Comment
        if: github.event_name == 'pull_request'
        run: |
          # Update the previous bot comment if present so the PR keeps a single, current table
          MARKER='## 📊 Code Coverage (all modules)'
          PR=${{ github.event.pull_request.number }}
          ID=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARKER\")))] | last | .id // empty")
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$ID" -F body=@coverage-comment.md
          else
            gh pr comment "$PR" --repo "${{ github.repository }}" --body-file coverage-comment.md
          fi

      - name: Post Commit Comment (main)
        if: github.event_name == 'push'
        run: |
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@coverage-comment.md

  ui-tests:
    name: UI Tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Run UI Tests
        run: |
          xcrun simctl list devices available > /dev/null
          scripts/ui-test.sh

      - name: Upload UI Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: ${{ runner.temp }}/apoorva-xc/ApoorvaUITests.*

  sonarcloud-analysis:
    name: SonarCloud Scan
    needs: build-and-test # Wait for build to finish
    if: needs.build-and-test.result == 'success' # Skipped when no module was affected
    runs-on: ubuntu-latest # Linux runner supports the container action

    # Add the permissions block here at the job level
    permissions:
      pull-requests: write # Allows SonarCloud to post PR comments
      contents: read       # Required to checkout the code
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Download All Coverage Artifacts
        uses: actions/download-artifact@v4
        with:
          path: coverage-reports
          pattern: coverage-* # Downloads all artifacts matching this pattern
          merge-multiple: true # Flattens them into the coverage-reports directory

      - name: Prepare Coverage Paths
        id: coverage
        run: |
          # Finds all XML files and joins them into a comma-separated string
          PATHS=$(ls coverage-reports/*-coverage.xml | paste -sd "," -)
          echo "paths=$PATHS" >> $GITHUB_OUTPUT

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=manikantanandam_apoorva-skip
            -Dsonar.organization=manikanta-nandam
            -Dsonar.sources=.
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*Tests.swift,**/*Test.swift
            -Dsonar.exclusions=**/.skip/**,**/Skip/**,**/*.kt,**/build/**
            -Dsonar.coverage.exclusions=**/*View.swift,**/*Screens.swift,**/*Sheets.swift,**/Containers/**,**/Router/**,app/**
            -Dsonar.coverageReportPaths=${{ steps.coverage.outputs.paths }}
            -Dsonar.c.compiler=/usr/bin/clang