# iOS: LoginUITests "Wrong password shows error"
appId: com.apoorva.app
---
- runFlow: ../../common/open-email-sign-in.yaml
- runFlow:
    file: ../../common/sign-in.yaml
    env:
      EMAIL: "uitest@apoorva.app"
      PASSWORD: "wrong-password"
- extendedWaitUntil:
    visible:
      id: "emailSignIn.error"
    timeout: 10000
# iOS checks `.exists` (DOM presence), not viewport visibility; the error note pushes the button
# below the fold on some Android screens, so scroll to it before asserting like Maestro's twin should.
- scrollUntilVisible:
    element:
      id: "emailSignIn.signInButton"
    timeout: 5000
