# iOS: LoginUITests "Wrong password shows error"
appId: com.apoorva.app
---
- runFlow: ../../common/open-email-sign-in.yaml
- runFlow:
    file: ../../common/sign-in.yaml
    env:
      EMAIL: "uitest@apoorva.app"
      PASSWORD: "wrong-password"
- extendedWaitUntil:
    visible:
      id: "emailSignIn.error"
    timeout: 10000
- assertVisible:
    id: "emailSignIn.signInButton"
