# Twin of AppLauncher.launchSeeded + HomeScreen.waitForSeededHome. SEED defaults to fancy.
# Seeding saves customers first and bills last, so a listed bill means the sample data is complete.
appId: com.apoorva.app
env:
  SEED: fancy
---
- runFlow:
    file: launch.yaml
    env:
      SEED: ${SEED}
- retry: # a system "isn't responding" dialog can cover Home while seeding
    maxRetries: 2
    commands:
      - runFlow: dismiss-system-dialogs.yaml
      - extendedWaitUntil:
          visible:
            text: "New bill"
          timeout: 30000
- extendedWaitUntil:
    visible:
      text: "Ravi Kumar, #D-.*"
    timeout: 60000
